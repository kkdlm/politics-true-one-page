name: probe-pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe api
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "== repo: ${{ github.repository }}"
            echo "== GET /pages"
            curl -sS -w "\nHTTP:%{http_code}\n" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages" || true
            echo "== POST /pages"
            curl -sS -w "\nHTTP:%{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}' "https://api.github.com/repos/${{ github.repository }}/pages" || true
          } > pages_probe.txt 2>&1
      - name: commit probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages_probe.txt
          git diff --cached --quiet || (git commit -m "pages probe [skip ci]" && git push)
