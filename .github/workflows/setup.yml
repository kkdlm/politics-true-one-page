name: sync-from-cdn
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-cdn
  cancel-in-progress: false
jobs:
  sync:
    if: "!contains(github.event.head_commit.message || '', '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch html
        run: curl -fsSL --retry 3 --retry-delay 2 -o index.html "https://aka.doubaocdn.com/s/X3XU6ViEUw"
      - name: fetch assets
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o apple-touch-icon.png "https://aka.doubaocdn.com/s/MwwMp4POW7"
          curl -fsSL --retry 3 -o icon-192.png "https://aka.doubaocdn.com/s/SlxUDO6fjF"
          curl -fsSL --retry 3 -o icon-512.png "https://aka.doubaocdn.com/s/MzKGMMSU32"
          curl -fsSL --retry 3 -o manifest.webmanifest "https://aka.doubaocdn.com/s/NUvVPJvdtZ"
          curl -fsSL --retry 3 -o startup-1290x2796.png "https://aka.doubaocdn.com/s/aeBRrCxcSb"
          curl -fsSL --retry 3 -o startup-1179x2556.png "https://aka.doubaocdn.com/s/4KfFakAURY"
          curl -fsSL --retry 3 -o startup-1170x2532.png "https://aka.doubaocdn.com/s/kXkiLsONuN"
          curl -fsSL --retry 3 -o sw.js "https://aka.doubaocdn.com/s/g4ZDUxEyUN"
          grep -q "app-1.2.10" sw.js || { echo "::error::sw stale"; exit 1; }
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html apple-touch-icon.png icon-192.png icon-512.png manifest.webmanifest startup-*.png sw.js
          if git diff --cached --quiet; then echo "已是最新"; exit 0; fi
          git commit -m "更新 index.html v1.2.10 启动屏点击即入 [skip ci]"
          for i in 1 2 3; do
            if git push; then echo "pushed (try $i)"; exit 0; fi
            git pull --rebase --autostash origin main || true
          done
          exit 1
