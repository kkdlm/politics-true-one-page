<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-fs="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#A5342E">
<title>政治一页纸 · 真一页</title>
<style>
:root{
  --paper:#F2ECDD; --card:#FDFAF2; --ink:#1B1815; --ink-2:#4A4238; --ink-3:#8A7F70;
  --red:#A5342E; --red-soft:#F6E7E3; --line:#DCD1BC; --line-2:#E7DCC8;
  --cov:#E9DFC9; --cov-line:#D6C7AB; --cov-cue:#8A7A5E;
  --nav:#F7F2E6; --topfade:linear-gradient(#F2ECDD 72%,rgba(242,236,221,0));
  --shadow:0 10px 24px -18px rgba(60,44,20,.5);
  --fs:1; --hdr:0px;
}
html[data-theme="night"]{
  --paper:#14110D; --card:#211C16; --ink:#EDE7D8; --ink-2:#BDB4A2; --ink-3:#8B8272;
  --red:#C9564A; --red-soft:#2A1E19; --line:#3A332A; --line-2:#2E2821;
  --cov:#2A241C; --cov-line:#3B332A; --cov-cue:#7C7264;
  --nav:#1A1611; --topfade:linear-gradient(#14110D 72%,rgba(20,17,13,0));
  --shadow:0 10px 24px -18px rgba(0,0,0,.8);
}
html[data-fs="s"]{--fs:.9} html[data-fs="l"]{--fs:1.12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Helvetica Neue",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;padding:0}
input{font-family:inherit}
.serif{font-family:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif}
.wrap{max-width:600px;margin:0 auto;padding:0 18px}

/* 顶栏 */
.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line-2)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-top:9px;padding-bottom:9px}
.seal{width:34px;height:34px;flex:0 0 34px;border-radius:8px;background:var(--red);color:#F6E9CE;
  display:grid;place-items:center;font-family:"Songti SC",serif;font-size:17px;box-shadow:0 5px 12px -6px var(--red)}
.tt b{display:block;font-family:"Songti SC","Noto Serif SC",serif;font-size:16px;letter-spacing:.06em;line-height:1.2}
.tt span{display:block;font-size:10.5px;color:var(--ink-3);letter-spacing:.1em;margin-top:2px}
.prog{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3)}
.prog b{font-variant-numeric:tabular-nums;font-weight:600}
.icon{width:32px;height:32px;display:grid;place-items:center;color:var(--ink-3);font-size:17px}

/* 工具条 */
.bar{position:sticky;top:var(--hdr,0px);z-index:25;background:var(--topfade);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);padding:8px 0 4px}
.bar .row{display:flex;gap:8px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:8px 11px;min-width:0}
.search svg{flex:0 0 15px;color:var(--ink-3)}
.search input{border:none;outline:none;background:none;flex:1;min-width:0;font-size:13px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3);font-size:12.5px}
.modes{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;flex:0 0 auto}
.modes button{font-size:12px;padding:5px 11px;border-radius:8px;color:var(--ink-3);letter-spacing:.06em}
.modes button.on{background:var(--red);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 4px;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:11.5px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);
  background:var(--card);color:var(--ink-2);white-space:nowrap;transition:.15s}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .n{opacity:.55;margin-left:4px;font-variant-numeric:tabular-nums}
.chip-sep{flex:0 0 1px;align-self:center;height:14px;background:var(--line);margin:0 2px}

/* 文档 */
main{padding-bottom:80px}
.doc{padding-top:6px}
.match{font-size:11.5px;color:var(--ink-3);padding:6px 2px 0}

/* 章节 */
.ch{display:flex;align-items:baseline;gap:8px;margin:26px 0 4px;padding-bottom:7px;
  border-bottom:2px solid var(--line);font-family:"Songti SC","Noto Serif SC",serif;
  font-size:18px;font-weight:600;letter-spacing:.05em}
.ch:first-child{margin-top:10px}
.ch em{font-style:normal;font-size:11px;color:var(--ink-3);font-weight:400;letter-spacing:.08em;margin-left:auto;
  font-family:inherit}
.ch .line{display:none}

/* 考点 */
.pt{padding:13px 0 15px;border-bottom:1px dashed var(--line-2)}
.pt:last-child{border-bottom:none}
.pt-head{display:flex;align-items:flex-start;gap:8px}
.pn{flex:0 0 auto;font-family:"Songti SC",serif;font-size:11.5px;color:var(--red);letter-spacing:.08em;
  font-variant-numeric:tabular-nums;padding-top:3px;min-width:26px}
.pt h3{flex:1;min-width:0;margin:0;font-family:"Songti SC","Noto Serif SC",serif;
  font-size:calc(16.5px * var(--fs));font-weight:600;line-height:1.42;letter-spacing:.02em}
.acts{display:flex;gap:2px;flex:0 0 auto;margin-top:-2px}
.acts button{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--ink-3);
  font-size:14px;transition:.15s}
.acts button.on{color:var(--red)}
.acts button:active{background:var(--line-2)}
.pt-body{margin-top:7px;padding-left:34px}
@media (max-width:420px){ .pt-body{padding-left:0} }

/* 正文行 */
.ln{margin:0 0 6px;font-size:calc(13.9px * var(--fs));line-height:1.86;letter-spacing:.01em;color:var(--ink-2)}
.ln:last-child{margin-bottom:0}
.ln.ind{padding-left:1.1em;text-indent:-1.1em}
.k{font-weight:600;color:color-mix(in srgb,var(--red) 82%,var(--ink));letter-spacing:.02em}
.g{color:var(--ink-3)}
.hd{margin:12px 0 5px;font-family:"Songti SC","Noto Serif SC",serif;
  font-size:calc(15px * var(--fs));font-weight:600;color:var(--ink);letter-spacing:.04em;line-height:1.55}
.hd:first-child{margin-top:0}
img.map{width:100%;border-radius:8px;border:1px solid var(--line-2);margin:8px 0 4px}
.mapcap{font-size:10.5px;color:var(--ink-3);text-align:center;margin-bottom:4px}

/* 挖空 */
html[data-mode="blank"] .k{cursor:pointer;background:var(--cov);color:transparent;border-radius:4px;
  padding:0 4px;margin:0 -1px;border-bottom:1px solid var(--cov-line);position:relative;
  background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--card) 40%,transparent) 0 5px,transparent 5px 10px)}
html[data-mode="blank"] .k.on{background:none;background-image:none;color:color-mix(in srgb,var(--red) 82%,var(--ink));
  border-bottom-color:transparent;cursor:default}
.fab{display:none}
html[data-mode="blank"] .fab{display:flex;gap:8px;position:fixed;right:14px;
  bottom:calc(18px + env(safe-area-inset-bottom));z-index:40}
.fab button{font-size:12px;padding:9px 14px;border-radius:20px;background:var(--card);
  border:1px solid var(--line);color:var(--ink-2);box-shadow:var(--shadow)}
.fab button:active{border-color:var(--red);color:var(--red)}
.hint{display:none;font-size:11.5px;color:var(--ink-3);text-align:center;padding:8px 0 0}
html[data-mode="blank"] .hint{display:block}

/* 页脚 */
.foot{margin-top:26px;padding:16px 0 8px;border-top:1px solid var(--line-2);text-align:center;
  font-size:11px;color:var(--ink-3);line-height:1.9;letter-spacing:.04em}

/* 弹层 */
.mask{position:fixed;inset:0;z-index:60;background:rgba(20,16,12,.5);opacity:0;pointer-events:none;transition:.25s;
  display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.mask.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:520px;max-height:min(86vh,720px);overflow-y:auto;background:var(--card);
  border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(14px);transition:.25s;box-shadow:0 -12px 40px -20px rgba(0,0,0,.6)}
.mask.on .sheet{transform:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sh-head b{font-family:"Songti SC","Noto Serif SC",serif;font-size:16px;letter-spacing:.05em}
.sh-head button{width:30px;height:30px;font-size:20px;color:var(--ink-3);line-height:1}
.sec{margin-bottom:16px}
.sec h4{margin:0 0 8px;font-size:11.5px;color:var(--ink-3);letter-spacing:.12em;font-weight:500}
.seg{display:flex;gap:7px}
.seg button{flex:1;font-size:12.5px;padding:9px 0;border-radius:10px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink-2)}
.seg button.on{background:var(--red);border-color:var(--red);color:#fff}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:11px 0;
  border-bottom:1px solid var(--line-2);font-size:13.5px;text-align:left}
.opt small{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;font-weight:400}
.opt .n{font-size:11.5px;color:var(--ink-3)}
.sheet textarea{width:100%;height:120px;margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font-size:12px;line-height:1.6;resize:vertical;outline:none;font-family:inherit}
.act{display:flex;gap:8px;margin-top:10px}
.act button{flex:1;padding:11px 0;border-radius:10px;font-size:13px;border:1px solid var(--line);background:var(--paper)}
.act button.primary{background:var(--red);border-color:var(--red);color:#fff}
.fine{font-size:11.5px;color:var(--ink-3);line-height:1.8}
.keyrow{display:flex;gap:8px;margin:10px 0 8px}
.keyrow input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font-size:13px;outline:none;font-family:inherit}
.keyrow input:focus{border-color:var(--red)}
.keyrow button{flex:0 0 auto;padding:0 15px;border-radius:10px;border:1px solid var(--line);
  background:var(--paper);font-size:12.5px;color:var(--ink-2)}
.keyrow button:active{border-color:var(--red);color:var(--red)}
.code{width:100%;height:88px;margin-top:9px;padding:10px;border-radius:10px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font-size:11.5px;line-height:1.5;resize:vertical;outline:none;
  font-family:ui-monospace,Menlo,monospace;word-break:break-all}
.tagline{font-size:11px;color:var(--red);margin-top:6px}
.fsprev{font-size:calc(13.9px * var(--fs));line-height:1.86;color:var(--ink-2);margin:9px 0 0;
  padding:10px 12px;border:1px dashed var(--line);border-radius:10px}
.fsprev em{font-style:normal;color:var(--ink-3);font-size:10.5px;display:block;margin-bottom:4px;letter-spacing:.1em}
.verbar{position:fixed;left:0;right:0;top:0;z-index:900;display:flex;gap:8px;align-items:center;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--red);color:#fff;
  transform:translateY(-130%);transition:transform .32s ease;box-shadow:0 3px 14px rgba(0,0,0,.18);
  font-size:12.5px;line-height:1.45}
.verbar.show{transform:none}
.verbar .vb-txt{flex:1;min-width:0}
.verbar .vb-act{flex:0 0 auto;padding:5px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.55);
  background:transparent;color:#fff;font-size:12px}
.verbar .vb-x{flex:0 0 auto;padding:0 5px;background:transparent;border:0;color:#fff;font-size:17px;opacity:.75}
.clog{padding:11px 0;border-bottom:1px dashed var(--line)}
.clog:last-child{border-bottom:0}
.clog-h{display:flex;align-items:center;gap:7px}
.clog-h .v{font-size:12.5px;font-weight:700;color:var(--red);letter-spacing:.02em}
.clog-h .d{font-size:10.5px;color:var(--ink-3)}
.clog-h .now{background:var(--red);color:#fff;border-radius:4px;padding:1px 5px;font-size:9.5px}
.clog-t{font-size:12.5px;font-weight:600;margin:3px 0 2px}
.clog li{font-size:11.5px;line-height:1.8;color:var(--ink-2)}

</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="seal serif">页</div>
    <div class="tt"><b>政治一页纸</b><span id="subline">真一页 · 100 考点</span></div>
    <div class="prog">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <circle cx="13" cy="13" r="11" fill="none" stroke="var(--line)" stroke-width="2.6"/>
        <circle id="arc" cx="13" cy="13" r="11" fill="none" stroke="var(--red)" stroke-width="2.6"
          stroke-linecap="round" stroke-dasharray="69.1" stroke-dashoffset="69.1"
          transform="rotate(-90 13 13)"/>
      </svg>
      <b id="pct">0%</b>
    </div>
    <button class="icon" onclick="openSet()" aria-label="设置">⚙</button>
  </div>
</header>

<div class="bar" id="bar">
  <div class="wrap">
    <div class="row">
      <div class="search">
        <svg viewBox="0 0 16 16" width="15" height="15"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <input id="q" type="search" placeholder="搜考点 / 关键词" autocomplete="off">
      </div>
      <div class="modes">
        <button id="mRead" class="on" onclick="setMode('read')">通读</button>
        <button id="mBlank" onclick="setMode('blank')">挖空</button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<main class="wrap">
  <div class="match" id="match"></div>
  <div class="doc" id="doc"></div>
  <div class="hint">灰色块是考点词，点一下揭示 · 长按正文可复制</div>
<div class="fab" id="fab">
  <button onclick="revealAll()">全部揭示</button>
  <button onclick="resetBlanks()">重新遮住</button>
</div>
  <div class="foot" id="foot"></div>
</main>

<div class="mask" id="mask" onclick="if(event.target===this)closeSet()">
  <div class="sheet">
    <div class="sh-head"><b id="shTitle">设置</b><button onclick="closeSet()">×</button></div>
    <div id="shBody"></div>
  </div>
</div>

function load(){
  try{
    let raw=localStorage.getItem(KEY);
    if(!raw){ /* 首次启用独立存储：若此前与完整版共用的旧键里有数据，搬一次 */
      try{
        const old=localStorage.getItem(OLDKEY);
        if(old){ localStorage.setItem(KEY,old); raw=old; }
      }catch(e){}
    }
    const o=JSON.parse(raw||'{}');
    return Object.assign({},DEF,o,{status:o.status||{},fav:o.fav||[],due:o.due||{},seen:o.seen||{},log:o.log||{}});
  }
  catch(e){ return JSON.parse(JSON.stringify(DEF)); }
}

function pad3(n){ return String(n).padStart(3,'0'); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---------- 正文行渲染 ---------- */
function lineHTML(line){
  return line.map(([t,f])=>{
    if(f==='k') return `<span class="k">${esc(t)}</span>`;
    if(f==='g') return `<span class="g">${esc(t)}</span>`;
    return esc(t);
  }).join('');
}
function isHead(line){
  const txt=line.map(s=>s[0]).join('').trim();
  const allKey=line.every(s=>s[1]);
  if(txt.length>14) return false;
  return allKey || /[：？]$/.test(txt);
}
function bodyHTML(p){
  return p.lines.map(l=>{
    if(isHead(l)) return `<div class="hd">${lineHTML(l)}</div>`;
    const txt=l.map(s=>s[0]).join('').trim();
    const isList=/^[①②③④⑤⑥⑦⑧⑨（(]|^\d+[.、]/.test(txt);
    return `<p class="ln${isList?' ind':''}">${lineHTML(l)}</p>`;
  }).join('') + (p.img?`<img class="map" src="${p.img}" alt="史纲整体脉络图"><div class="mapcap">史纲整体脉络图 · 可双指放大</div>`:'');
}

/* ---------- 筛选 ---------- */
let FLT='all', Q='';
function match(p){
  if(FLT==='fav' && !(S.fav||[]).includes(p.n)) return false;
  if(FLT==='todo' && S.status[p.n]==='ok') return false;
  if(FLT==='due' && !(S.due[p.n] && S.due[p.n]<=now())) return false;
  if(FLT!=='all' && FLT!=='fav' && FLT!=='todo' && FLT!=='due' && p.ch!==FLT) return false;
  if(Q){
    const t=p.title+' '+p.lines.map(l=>l.map(s=>s[0]).join('')).join(' ');
    if(!t.includes(Q)) return false;
  }
  return true;
}
function applyFilter(){
  let n=0;
  document.querySelectorAll('#doc .pt').forEach(el=>{
    const p=PTS.find(x=>x.n===+el.id.slice(2));
    const ok=match(p);
    el.style.display=ok?'':'none';
    if(ok) n++;
  });
  // 章节标题：该章节无可见条目则隐藏
  document.querySelectorAll('#doc .ch').forEach(h=>{
    const ch=h.dataset.ch; let vis=0;
    document.querySelectorAll('#doc .pt[data-ch="'+CSS.escape(ch)+'"]').forEach(el=>{ if(el.style.display!=='none') vis++; });
    h.style.display=vis?'':'none';
  });
  document.getElementById('match').textContent = (Q||FLT!=='all') ? `筛选结果 ${n} 条` : '';
}
function setFlt(k){
  FLT=k; chipRow(); applyFilter();
  window.scrollTo({top:0,behavior:'smooth'});
}
function chipRow(){
  const el=document.getElementById('chips');
  const due=PTS.filter(p=>S.due[p.n]&&S.due[p.n]<=now()).length;
  const todo=PTS.filter(p=>S.status[p.n]!=='ok').length;
  const fav=(S.fav||[]).length;
  let h=`<button class="chip ${FLT==='all'?'on':''}" onclick="setFlt('all')">全部<span class="n">${PTS.length}</span></button>`
       +`<button class="chip ${FLT==='due'?'on':''}" onclick="setFlt('due')">待复习<span class="n">${due}</span></button>`
       +`<button class="chip ${FLT==='fav'?'on':''}" onclick="setFlt('fav')">★ 收藏<span class="n">${fav}</span></button>`
       +`<button class="chip ${FLT==='todo'?'on':''}" onclick="setFlt('todo')">未掌握<span class="n">${todo}</span></button>`
       +`<span class="chip-sep"></span>`;
  h+=CH.map(c=>{
    const n=PTS.filter(p=>p.ch===c.k).length;
    return `<button class="chip ${FLT===c.k?'on':''}" onclick="setFlt('${c.k}')">${c.k}<span class="n">${n}</span></button>`;
  }).join('');
  el.innerHTML=h;
}

function markOk(n,btn){
  const el=document.getElementById('p-'+n);
  if(S.status[n]==='ok'){ delete S.status[n]; delete S.due[n]; if(btn){btn.classList.remove('on');btn.textContent='○';} }
  else { S.status[n]='ok'; S.due[n]=now()+4*DAY; if(btn){btn.classList.add('on');btn.textContent='✓';} bumpLog(); }
  save(); refreshProg(); chipRow(); haptic();
  if(FLT!=='all') applyFilter();
}
function toggleFav(n,btn){
  const has=(S.fav||[]).includes(n);
  S.fav = has ? S.fav.filter(x=>x!==n) : (S.fav||[]).concat(n);
  if(btn){ btn.classList.toggle('on',!has); btn.textContent = has?'☆':'★'; }
  save(); chipRow(); haptic();
  if(FLT==='fav') applyFilter();
}
function bumpLog(){ const k=dkey(now()); S.log[k]=(S.log[k]||0)+1; }
function refreshProg(){
  const ok=PTS.filter(p=>S.status[p.n]==='ok').length;
  const pct=Math.round(ok/PTS.length*100);
  document.getElementById('pct').textContent=pct+'%';

  document.getElementById('arc').setAttribute('stroke-dashoffset', String(C*(1-pct/100)));

}

/* ---------- 进度备份：密钥 + 备份码 ---------- */
const SALT='yzy-2027-onepage';
function keyOf(){ const el=document.getElementById('keyin'); const v=(el?el.value:S.key||'').trim(); return v; }
function saveKey(){
  const v=keyOf();
  if(v.length<4){ mtoast('密钥至少 4 位'); return; }
  S.key=v; save();
  const t=document.getElementById('keytip'); if(t) t.textContent='密钥已保存 · 只存在本机';
  mtoast('密钥已保存，只存在本机');
}
function b64e(bytes){
  let s=''; const b=new Uint8Array(bytes);
  for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64d(str){
  str=String(str).replace(/-/g,'+').replace(/_/g,'/');
  const pad=str.length%4?('='.repeat(4-str.length%4)):'';
  const bin=atob(str+pad); const b=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i);
  return b;
}
async function derive(pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode(SALT),iterations:12000,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function makeCode(){
  const pw=keyOf();
  if(pw.length<4){ mtoast('先在下面输入密钥（至少 4 位）'); return; }
  S.key=pw; save();
  const pack={v:1,at:Date.now(),status:S.status,fav:S.fav,due:S.due,seen:S.seen,log:S.log};
  try{
    const k=await derive(pw);
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(pack))));
    const all=new Uint8Array(iv.length+ct.length); all.set(iv,0); all.set(ct,iv.length);
    const code='YZ1.'+b64e(all);
    S.syncAt=pack.at; save();
    const box=document.getElementById('codebox');
    box.innerHTML=`<textarea class="code" readonly onclick="this.select()">${esc(code)}</textarea>
      <div class="keyrow"><button style="flex:1" onclick="copyCode(this)">复制同步码</button>
      <button style="flex:1" onclick="openRestore()">已有码，去恢复</button></div>`;
    mtoast('同步码已生成，复制存好');
    openSet2();
  }catch(e){ mtoast('加密失败：'+e.message); }
}
function openSet2(){
  const t=document.getElementById('keytip');
  if(t&&S.key) t.textContent='已设置密钥 · 上次生成 '+(new Date(S.syncAt||Date.now()).getMonth()+1)+'/'+new Date(S.syncAt||Date.now()).getDate();
}
function copyCode(btn){
  const t=document.querySelector('#codebox textarea'); t.select();
  try{ navigator.clipboard.writeText(t.value); btn.textContent='已复制'; setTimeout(()=>btn.textContent='复制同步码',1200); }
  catch(e){ document.execCommand('copy'); btn.textContent='已复制'; setTimeout(()=>btn.textContent='复制同步码',1200); }
}
function openRestore(){
  const box=document.getElementById('codebox');
  box.innerHTML=`<textarea class="code" id="restorein" placeholder="粘贴 YZ1. 开头的同步码…"></textarea>
    <div class="keyrow"><button style="flex:1" onclick="doRestore()">解密恢复</button>
    <button style="flex:1" onclick="makeCode()">返回生成</button></div>`;
  document.getElementById('restorein').focus();
}
async function doRestore(){
  const pw=keyOf();
  const code=(document.getElementById('restorein').value||'').trim();
  if(pw.length<4){ mtoast('先在上方输入同一把密钥'); return; }
  if(!code.startsWith('YZ1.')){ mtoast('同步码应以 YZ1. 开头'); return; }
  if(!confirm('恢复会覆盖本机当前的掌握与收藏记录，继续？')) return;
  try{
    const raw=b64d(code.slice(4));
    const iv=raw.slice(0,12), ct=raw.slice(12);
    const k=await derive(pw);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},k,ct);
    const o=JSON.parse(new TextDecoder().decode(pt));
    S.key=pw;
    S.status=o.status||{}; S.fav=o.fav||[]; S.due=o.due||{}; S.seen=o.seen||{}; S.log=o.log||{};
    S.syncAt=o.at||Date.now();
    save(); applyPrefs(); renderDoc(); chipRow(); refreshProg();
    mtoast('已恢复：'+Object.keys(S.status).length+' 条已掌握、'+ (S.fav.length)+' 条收藏');
    setTimeout(closeSet,1000);
  }catch(e){ mtoast('解密失败：密钥不对或同步码不完整'); }
}

   '顶部「通读 / 挖空」两段切换，挖空逐词遮盖 1,930 个考点词',
   '搜索实时过滤、chip 筛选、○→✓ 掌握、☆→★ 收藏、顶部环形进度',
   '单文件 232 KB，比完整版小 55%']}
];
function openChangelog(){
  document.getElementById('shTitle').textContent='版本记录';
  document.getElementById('shBody').innerHTML=`
    <div class="sec">
      ${CHANGELOG.map((c,i)=>`<div class="clog">
        <div class="clog-h"><span class="v">v${c.v}</span><span class="d">${c.d}</span>${i===0?'<span class="now">当前</span>':''}</div>
        <div class="clog-t">${esc(c.t)}</div>
        <ul>${c.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      </div>`).join('')}
    </div>
    <div class="fine">当前版本 v${VER} · 单文件运行，更新即覆盖式升级，进度数据仍在本机。</div>`;
  document.getElementById('mask').classList.add('on');
}

/* ---------- 版本记录 ---------- */
function cmpVer(a,b){
  const x=String(a).split('.').map(Number), y=String(b).split('.').map(Number);
  for(let i=0;i<3;i++){ const A=x[i]||0, B=y[i]||0; if(A!==B) return A>B?1:-1; }
  return 0;
}
function verBar(msg,btnTxt,onAct,sticky){
  let el=document.getElementById('verbar');
  if(!el){ el=document.createElement('div'); el.id='verbar'; el.className='verbar'; document.body.appendChild(el); }
  el.innerHTML='<span class="vb-txt"></span><button class="vb-act"></button><button class="vb-x">×</button>';
  el.querySelector('.vb-txt').textContent=msg;
  const b=el.querySelector('.vb-act');
  b.textContent=btnTxt;
  b.onclick=onAct;
  el.querySelector('.vb-x').onclick=()=>{ el.classList.remove('show'); clearTimeout(el._t); };
  el.classList.add('show');
  clearTimeout(el._t);
  if(!sticky) el._t=setTimeout(()=>el.classList.remove('show'),8000);
}
function refreshApp(){
  try{ location.replace(location.pathname+'?v='+Date.now()); }catch(e){ location.reload(); }
}
async function checkRemote(manual){
  try{
    const r=await fetch('./version.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('no');
    const j=await r.json();
    if(cmpVer(j.version,VER)>0){
      verBar('有新版本 v'+j.version,'立即更新',()=>refreshApp(),true);
    }else if(manual){ mtoast('已是最新版本 v'+VER); }
  }catch(e){
    if(manual) mtoast('检查不到更新信息（离线或直链打开时正常）');
  }
}
function checkNow(){ checkRemote(true); }
function bootVer(){
  let last=null;
  try{ last=localStorage.getItem(KEY+':ver'); localStorage.setItem(KEY+':ver',VER); }catch(e){}
  if(last && last!==VER){
    verBar('已更新至 v'+VER,'查看版本',()=>{ openChangelog(); document.getElementById('verbar').classList.remove('show'); },false);
  }
  window.__chkAt=Date.now();
  setTimeout(()=>checkRemote(false),1500);
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible' && Date.now()-window.__chkAt>600000){
      window.__chkAt=Date.now(); checkRemote(false);
    }
  });
}
setTimeout(bootVer,600);
